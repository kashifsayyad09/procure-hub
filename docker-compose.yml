# Local environment. Services are added as they are built.
# Database settings are passed as separate variables so a password may contain any character.
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET in .env}

services:
  mysql:
    image: mysql:8.4
    container_name: procurehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot and idempotent: creates databases and per-service users, also on an existing data volume.
  db-init:
    image: mysql:8.4
    command: ["bash", "/bootstrap/bootstrap.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      PURCHASE_REQUEST_DB_PASSWORD: ${PURCHASE_REQUEST_DB_PASSWORD:?Set PURCHASE_REQUEST_DB_PASSWORD in .env}
      APPROVAL_DB_PASSWORD: ${APPROVAL_DB_PASSWORD:?Set APPROVAL_DB_PASSWORD in .env}
      VENDOR_DB_PASSWORD: ${VENDOR_DB_PASSWORD:?Set VENDOR_DB_PASSWORD in .env}
      QUOTATION_DB_PASSWORD: ${QUOTATION_DB_PASSWORD:?Set QUOTATION_DB_PASSWORD in .env}
    volumes:
      - ./infrastructure/docker/db-bootstrap:/bootstrap:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  auth-migrate:
    build: { context: ./backend, dockerfile: services/auth-service/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
      DB_NAME: auth_db
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  auth-service:
    build: { context: ./backend, dockerfile: services/auth-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_NAME: auth_db
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      COOKIE_SECURE: "false"   # local http only
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  purchase-request-migrate:
    build: { context: ./backend, dockerfile: services/purchase-request-service/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
      DB_NAME: purchase_request_db
      DB_USER: purchase_request_svc
      DB_PASSWORD: ${PURCHASE_REQUEST_DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  purchase-request-service:
    build: { context: ./backend, dockerfile: services/purchase-request-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_NAME: purchase_request_db
      DB_USER: purchase_request_svc
      DB_PASSWORD: ${PURCHASE_REQUEST_DB_PASSWORD}
      APPROVAL_SERVICE_URL: http://approval-service:8003   # the request still submits if this is down; a retry loop catches up
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      purchase-request-migrate:
        condition: service_completed_successfully

  approval-migrate:
    build: { context: ./backend, dockerfile: services/approval-service/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
      DB_NAME: approval_db
      DB_USER: approval_svc
      DB_PASSWORD: ${APPROVAL_DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  approval-service:
    build: { context: ./backend, dockerfile: services/approval-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_NAME: approval_db
      DB_USER: approval_svc
      DB_PASSWORD: ${APPROVAL_DB_PASSWORD}
      PURCHASE_REQUEST_SERVICE_URL: http://purchase-request-service:8002
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      approval-migrate:
        condition: service_completed_successfully

  vendor-migrate:
    build: { context: ./backend, dockerfile: services/vendor-service/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
      DB_NAME: vendor_db
      DB_USER: vendor_svc
      DB_PASSWORD: ${VENDOR_DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  vendor-service:
    build: { context: ./backend, dockerfile: services/vendor-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_NAME: vendor_db
      DB_USER: vendor_svc
      DB_PASSWORD: ${VENDOR_DB_PASSWORD}
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      vendor-migrate:
        condition: service_completed_successfully

  quotation-migrate:
    build: { context: ./backend, dockerfile: services/quotation-service/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
      DB_NAME: quotation_db
      DB_USER: quotation_svc
      DB_PASSWORD: ${QUOTATION_DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  quotation-service:
    build: { context: ./backend, dockerfile: services/quotation-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_NAME: quotation_db
      DB_USER: quotation_svc
      DB_PASSWORD: ${QUOTATION_DB_PASSWORD}
      VENDOR_SERVICE_URL: http://vendor-service:8004
      PURCHASE_REQUEST_SERVICE_URL: http://purchase-request-service:8002
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      quotation-migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
