# Local environment. Services are added as they are built.
services:
  mysql:
    image: mysql:8.4
    container_name: procurehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-migrate:
    build: ./backend/services/auth-service
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://auth_svc:${AUTH_DB_PASSWORD}@mysql:3306/auth_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  auth-service:
    build: ./backend/services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://auth_svc:${AUTH_DB_PASSWORD}@mysql:3306/auth_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: "false"   # local http only
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
